name: Handy-App

# Baut die Android-App (APK). Bei jedem Push wird sie als Download unter
# https://github.com/<besitzer>/<repo>/releases/tag/handy-app veröffentlicht.
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Brief-Analyse testen
        working-directory: android
        run: ./gradlew -p analyse test --no-daemon

      - name: APK bauen
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: APK bereitlegen
        run: cp android/app/build/outputs/apk/release/app-release.apk Briefverwaltung-Handy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Briefverwaltung-Handy
          path: Briefverwaltung-Handy.apk

      - name: Als Download veröffentlichen
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete handy-app --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create handy-app Briefverwaltung-Handy.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Handy-App (neueste Version)" \
            --notes "Android-App der Briefverwaltung: Briefe scannen, Text erkennen, analysieren und an den PC schicken. Auf dem Handy herunterladen und installieren (Installation aus unbekannten Quellen erlauben). Version 1.0.${GITHUB_RUN_NUMBER}, erstellt aus ${GITHUB_SHA::7}."
